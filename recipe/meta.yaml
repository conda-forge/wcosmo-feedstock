{% set name = "wcosmo" %}
{% set version = "0.7.1" %}
{% set python_min = "3.10" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/wcosmo-{{ version }}.tar.gz
  sha256: a7d7aaa69a2f1192d879b28f2c4ecf32cbbdddfccf04abd8fe60fa95fcb78f13

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools
    - setuptools-scm
    - pip
  run:
    - python >={{ python_min }}
    - numpy
    - scipy
    - astropy-base
    - array-api-compat
    - plum-dispatch

test:
  imports:
    - wcosmo
    - wcosmo.utils
  commands:
    - pip check
    - python -m pytest --pyargs wcosmo.test
  requires:
    - python {{ python_min }}
    - pip
    - pytest

about:
  home: https://github.com/ColmTalbot/wcosmo
  summary: A package for cosmology calculations with arbitrary numpy-like APIs
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - ColmTalbot
